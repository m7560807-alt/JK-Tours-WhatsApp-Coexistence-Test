<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JK Tours — WhatsApp Coexistence Test</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.5}
.card{border:1px solid #ddd;border-radius:14px;padding:24px}
button{padding:12px 18px;border:0;border-radius:10px;background:#1877f2;color:#fff;font-weight:700;cursor:pointer}
pre{white-space:pre-wrap;background:#f6f6f6;padding:14px;border-radius:10px;min-height:100px}
.warn{background:#fff7d6;padding:12px;border-radius:10px}
</style>
</head>
<body>
<h1>JK Tours WhatsApp Coexistence Test</h1>
<div class="card">
<p>This is a standalone test page. It does <b>not</b> modify your website or backend.</p>
<p class="warn"><b>Do not unregister or delete the existing WhatsApp Business number.</b></p>
<button id="connect">Connect existing WhatsApp Business app</button>
<h3>Status</h3>
<pre id="status">Waiting…</pre>
</div>

<script>
const APP_ID = "4669570849939067";
const CONFIG_ID = "1778293889854489";
const GRAPH_VERSION = "v23.0";

function status(msg) {
  document.getElementById("status").textContent =
    typeof msg === "string" ? msg : JSON.stringify(msg, null, 2);
}

window.fbAsyncInit = function() {
  FB.init({
    appId: APP_ID,
    cookie: true,
    xfbml: true,
    version: GRAPH_VERSION
  });
  status("Meta SDK loaded. Click the button to start the coexistence onboarding.");
};

(function(d, s, id) {
  var js, fjs = d.getElementsByTagName(s)[0];
  if (d.getElementById(id)) return;
  js = d.createElement(s); js.id = id;
  js.src = "https://connect.facebook.net/en_US/sdk.js";
  fjs.parentNode.insertBefore(js, fjs);
}(document, "script", "facebook-jssdk"));

document.getElementById("connect").addEventListener("click", function() {
  status("Opening Meta…");

  FB.login(function(response) {
    status({
      type: "FB.login callback",
      response: response
    });
  }, {
    config_id: CONFIG_ID,
    response_type: "code",
    override_default_response_type: true,
    extras: {
      setup: {},
      featureType: "whatsapp_business_app_onboarding",
      sessionInfoVersion: "3"
    }
  });
});

window.addEventListener("message", function(event) {
  if (!event.origin.includes("facebook.com")) return;
  status({
    type: "Embedded Signup message",
    origin: event.origin,
    data: event.data
  });
});
</script>
</body>
</html>
